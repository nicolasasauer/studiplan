name: studi_plan
description: StudiPlan - Dein persoenlicher Studienplaner
publish_to: 'none'
version: 1.0.0+7

environment:
  sdk: '>=3.10.0 <4.0.0'
  # file_picker 13 needs it; CI builds with 3.44.
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.7
  http: ^1.2.1
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  uuid: ^4.4.0
  file_picker: ^13.1.0
  share_plus: ^13.3.1
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  ios: true
  android: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  web:
    generate: false

# Windows package for the Microsoft Store, built in CI by
# .github/workflows/flutter-build-desktop.yml (`msix:create`, installed there
# globally, so pubspec.lock stays untouched). The identity values come from
# Partner Center (Product identity, Store ID 9NK019KJH9ZD) and must match it
# exactly, or the Store rejects the upload. Not secret: every Store package
# carries them. The Store signs the package itself, hence no certificate. CI
# passes the version; the Store demands a last segment of 0.
msix_config:
  display_name: StudiPlan
  publisher_display_name: NicoSauer
  identity_name: NicoSauer.StudiPlan
  publisher: CN=F6D658A6-2A12-4A5D-A119-F9C317712772
  logo_path: assets/icon/app_icon.png
  languages: de-de
  # Talks to a self-hosted StudiPlan server, on the internet or in the LAN
  # (e.g. http://192.168.x.x:3000). The app itself listens on nothing.
  capabilities: internetClient, privateNetworkClientServer
  store: true
  build_windows: false
